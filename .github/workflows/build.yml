name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip if project is zipped
        run: |
          if [ -z "$(find . -name settings.gradle.kts | head -1)" ]; then
            z=$(find . -maxdepth 2 -iname "*.zip" | head -1)
            if [ -n "$z" ]; then
              mkdir -p unpacked
              unzip -q -o "$z" -d unpacked
            fi
          fi

      - name: Locate project
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Repository contents:"
            find . -path ./.git -prune -o -type f -print | head -50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryGuard-debug
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
