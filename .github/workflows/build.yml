name: BatteryGuard Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One-time migration: unpack the archived Android project into the repo root.
      # Future builds use the normal Gradle project directly, without ZIP searching.
      - name: Extract project into repository root
        run: |
          if [ ! -f settings.gradle.kts ]; then
            test -f BatteryGuard.zip || { echo "BatteryGuard.zip missing"; exit 1; }
            mkdir -p .project_extract
            unzip -q BatteryGuard.zip -d .project_extract
            src=".project_extract/fps_fast"
            test -f "$src/settings.gradle.kts" || { echo "Expected project at $src"; exit 1; }
            for item in "$src"/* "$src"/.[!.]*; do
              [ -e "$item" ] || continue
              [ "$(basename "$item")" = ".github" ] && continue
              cp -a "$item" .
            done
            rm -rf .project_extract BatteryGuard.zip
          fi

      - name: Apply fixed top-left overlay layout
        run: python3 fix_overlay.py

      # Commit the extracted and patched source so the repository becomes editable
      # directly. This also removes the old source ZIP from the repo.
      - name: Save extracted source to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract project and fix fixed-corner overlay [skip ci]"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryGuard-debug
          path: app/build/outputs/apk/debug/*.apk
