name: BatteryGuard Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # The Android project is unpacked in the repository root:
      # edit app/src/main/java/com/example/batteryguard/FloatingBubble.kt
      # for the overlay and app/src/main/java/com/example/batteryguard/SettingsActivity.kt
      # for its settings controls.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryGuard-debug
          path: app/build/outputs/apk/debug/*.apk
